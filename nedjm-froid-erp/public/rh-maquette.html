<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>عرض تجريبي · Ressources humaines</title>
<style>
  :root {
    --bg: #f3f5fa;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --faint: #94a3b8;
    --line: #e6ebf3;
    --brand: #3b6ef5;
    --sky: #0284c7;
    --violet: #6d28d9;
    --shadow: 0 16px 36px -24px rgba(15, 23, 42, 0.45);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  button, input { font: inherit; }
  button { cursor: pointer; }
  .chrome { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 18px; padding: 10px 22px; }
  .mark { display: flex; align-items: center; gap: 10px; min-width: 180px; }
  .mark b { font-size: 14px; }
  .logo { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(145deg,#2451c9,#3b6ef5); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; box-shadow: 0 8px 16px -8px #2451c9; }
  .sections, .subs, .actions, .pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sections { flex: 1; }
  .sec, .sub, .btn, .pill { border: 0; background: transparent; color: var(--muted); border-radius: 12px; }
  .sec { height: 38px; padding: 0 14px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; }
  svg.lucide { width: 18px; height: 18px; stroke-width: 2; }
  .sec svg.lucide { width: 16px; height: 16px; }
  .sec.on { background: linear-gradient(145deg,#2451c9,#3b6ef5); color: #fff; box-shadow: 0 8px 18px -10px #2451c9; }
  .subs { padding: 0 22px; border-top: 1px solid var(--line); min-height: 42px; }
  .sub { height: 40px; padding: 0 12px; font-size: 13px; font-weight: 600; position: relative; }
  .sub.on { color: var(--brand); }
  .sub.on:after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px; background: var(--brand); }
  .banner { margin: 18px 22px 0; padding: 10px 14px; border-radius: 12px; background: #eef2ff; color: #3730a3; font-size: 13px; }
  main { padding: 18px 22px 40px; }
  .head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 16px; }
  .date { margin: 0 0 6px; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .date i { width: 8px; height: 8px; border-radius: 50%; background: #10b981; display: inline-block; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -0.03em; }
  .btn { height: 40px; padding: 0 16px; font-weight: 600; font-size: 14px; }
  .btn.sky { background: linear-gradient(145deg,#0369a1,#38bdf8); color: #fff; box-shadow: 0 10px 18px -12px #0284c7; }
  .btn.violet { background: linear-gradient(145deg,#6d28d9,#c4b5fd); color: #fff; box-shadow: 0 10px 18px -12px #7c3aed; }
  .btn.emerald { background: linear-gradient(145deg,#047857,#34d399); color: #fff; box-shadow: 0 10px 18px -12px #059669; }
  .btn.orange { background: linear-gradient(145deg,#c2410c,#fb923c); color: #fff; box-shadow: 0 10px 18px -12px #ea580c; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .kpis, .status, .split, .bottom, .cards { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(4, 1fr); margin-bottom: 14px; }
  .panel, .set { background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
  .kpi, .stat { position: relative; overflow: hidden; border: 0; color: #fff; background: var(--fill); box-shadow: 0 18px 34px -18px rgba(15,23,42,.65); }
  .kpi { border-radius: 22px; padding: 18px 18px 16px; min-height: 156px; display: flex; flex-direction: column; }
  .kpi:before, .stat:before { content: ""; position: absolute; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.16); top: -48px; right: -28px; }
  .kpi .ic, .stat .ic { position: relative; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
  .kpi .label { position: relative; margin: 14px 0 0; color: rgba(255,255,255,.82); font-size: 13px; font-weight: 600; }
  .kpi strong { position: relative; font-size: 34px; letter-spacing: -0.04em; line-height: 1.1; margin-top: 2px; color: #fff; }
  .kpi .hint { position: relative; margin-top: auto; padding-top: 10px; color: rgba(255,255,255,.78); font-size: 12px; }
  .kpi.calm { background: #fff; color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .kpi.calm:before { background: #f8fafc; }
  .kpi.calm .label, .kpi.calm .hint { color: var(--muted); }
  .kpi.calm strong { color: var(--ink); }
  .kpi.calm .ic { background: #f1f5f9; color: #64748b; box-shadow: none; }
  .status { grid-template-columns: repeat(4, 1fr); margin-bottom: 14px; }
  .stat { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; }
  .stat div { position: relative; }
  .stat b { display: block; font-size: 22px; line-height: 1; color: #fff; }
  .stat span { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.86); }
  .split { grid-template-columns: 1.7fr 1fr; margin-bottom: 14px; }
  .panel { padding: 18px 18px 12px; }
  .panel h2 { margin: 0 0 12px; font-size: 16px; }
  .panel .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .seg { display: flex; background: #f1f5f9; border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; height: 28px; padding: 0 10px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 12px; }
  .seg button.on { background: #fff; color: var(--ink); }
  svg.chart { width: 100%; height: 210px; display: block; }
  .donut-wrap { display: grid; place-items: center; min-height: 210px; position: relative; }
  .donut-wrap em { position: absolute; font-style: normal; text-align: center; }
  .donut-wrap strong { display: block; font-size: 28px; }
  .donut-wrap small { color: var(--muted); }
  .bottom { grid-template-columns: repeat(3, 1fr); }
  .alert, .hire { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .alert:first-of-type, .hire:first-of-type { border-top: 0; }
  .av, .dot { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: 0 0 auto; }
  .av { background: #eef2ff; color: var(--brand); border-radius: 50%; }
  .dot { background: #ffe4e6; color: #be123c; }
  .alert p, .hire p, .side-item p { margin: 0; }
  .alert small, .hire small, .muted { color: var(--muted); font-size: 12px; }
  .grow { flex: 1; min-width: 0; }
  .qa { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .qa button { border: 0; border-radius: 16px; min-height: 74px; font-weight: 700; font-size: 12px; background: var(--wash); color: var(--accent); transition: transform .15s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .qa button:hover, .kpi:hover { transform: translateY(-2px); }
  .qa button.neutral { background: #f1f5f9; color: #475569; }
  .panel h2 { display: flex; align-items: center; gap: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--faint); font-weight: 600; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; padding: 8px; }
  td { padding: 10px 8px; border-top: 1px solid var(--line); }
  tr.bad td:first-child { box-shadow: inset 3px 0 0 #e11d48; }
  .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--wash); color: var(--accent); }
  .work { display: grid; grid-template-columns: 1.7fr 0.8fr; gap: 14px; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters input, .field { height: 38px; border-radius: 12px; border: 1px solid var(--line); padding: 0 12px; background: #fff; color: var(--ink); }
  .filters input { flex: 1; }
  .side-item { padding: 10px 0; border-top: 1px solid var(--line); }
  .cards { grid-template-columns: repeat(3, 1fr); }
  .set { padding: 18px; }
  .set b { display: block; margin-bottom: 6px; }
  .set span { color: var(--muted); font-size: 13px; }
  .form { display: grid; gap: 10px; }
  .form label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 700; }
  .note { margin: 14px 0 0; color: var(--faint); font-size: 12px; }
  @media (max-width: 1100px) {
    .kpis, .status, .bottom, .cards { grid-template-columns: 1fr 1fr; }
    .split, .work { grid-template-columns: 1fr; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

    rows: [["—", "—", "Aucune proposition", "—"]],
    sideTitle: "Suite", side: ["L'approbation attend une date d'effet avant de changer un taux."] },
  juridiques: { title: "Documents juridiques", primary: ["Ajouter un texte", "violet", "juridiques"], secondary: ["Veille", "ghost", "veille"], kind: "table",
    kpis: quad(["—", "Salariés visés", "Textes rattachés aux gens"], ["—", "Portée", "Effet financier du texte"], ["—", "Date", "Publication"], ["0", "Sans pièce", "Aucun fichier manquant"]),
    columns: ["Titre", "Source", "Date", "Domaine"],
    rows: [["—", "—", "—", "Aucun texte archivé"]],
    sideTitle: "Lien", side: ["La lecture reste ici. Une suite devient une proposition."] },
  extraction: { title: "Extraction IA", primary: ["Lancer l'extraction", "violet", "extraction"], secondary: ["Documents", "ghost", "juridiques"], kind: "table",
    kpis: quad(["—", "Documents", "Lots lus"], ["—", "Valeurs", "Montants proposés"], ["—", "À relire", "Décision en attente"], ["0", "Rejetés", "Aucune extraction en échec"]),
    columns: ["Document", "Champ proposé", "Valeur", "Décision"],
    rows: [["—", "—", "—", "Aucune extraction"]],
    sideTitle: "Garde", side: ["Rien n'est écrit dans un taux avant l'acceptation."] },
  veille: { title: "Veille juridique", primary: ["Actualiser", "violet", "veille"], secondary: ["Sources", "ghost", "veille"], kind: "table",
    kpis: quad(["—", "Textes", "Détections"], ["—", "Impact", "Effet éventuel sur la paie"], ["—", "Détecté le", "Fraîcheur de la veille"], ["0", "À traiter", "Aucune détection en attente"]),
    columns: ["Texte", "Source", "Détecté le", "Suite"],
    rows: [["—", "—", "—", "Aucune détection"]],
    sideTitle: "Onglets internes", side: ["Textes, Sources, Domaines, Mots-clés, Historique."] },
  autres: { title: "Autres", primary: ["Réorganiser", "violet", "autres"], secondary: ["Vue d'ensemble", "ghost", "dashboard"], kind: "cards",
    kpis: quad(["—", "Personnes", "Cet écran ne compte pas l'effectif"], ["—", "Montants", "Aucun argent ici"], ["—", "Période", "Pas une page de temps"], ["0", "À ranger", "Aucun onglet en souffrance"]),
    cards: [["Onglets rangés", "0"], ["Section toujours visible", "Même vide"], ["Usage", "On y déplace un onglet depuis Réorganiser."]] },
  parametres: { title: "Paramètres RH", primary: ["Rubriques", "emerald", "parametres"], secondary: ["Listes", "ghost", "parametres"], kind: "cards",
    kpis: quad(["—", "Personnes", "Le réglage ne change pas l'effectif"], ["—", "Barèmes", "Rubriques et taux"], ["—", "Application", "Date d'effet des réglages"], ["0", "Incomplet", "Aucun réglage bloquant"]),
    cards: [["Rubriques de salaire", "Dictionnaire et valeurs"], ["Cotisations et impôts", "CNAS, CACOBATPH, IRG"], ["Modèle de fiche", "Sections de la fiche employé"], ["Listes et codes", "Référentiels RH"], ["Modèle de bulletin", "Mise en page du bulletin"], ["Feuille de présence", "Codes de pointage"]] },
};

function quad(people, money, time, alert) {
  return [
    [people, "violet"],
    [money, "emerald"],
    [time, "sky"],
    [alert, alert[3] ? "rose" : "calm"],
  ].map(([item, accent]) => ({ value: item[0], label: item[1], hint: item[2], accent, calm: accent === "calm" }));
}

const ACCENT = { violet: "#6d28d9", emerald: "#059669", sky: "#0284c7", rose: "#e11d48", teal: "#0f766e", pink: "#be185d", orange: "#c2410c", amber: "#a16207" };
const WASH = { violet: "#ede9fe", emerald: "#d1fae5", sky: "#e0f2fe", rose: "#ffe4e6", teal: "#ccfbf1", pink: "#fce7f3", orange: "#ffedd5", amber: "#fef9c3" };
const FILL = {
  violet: "linear-gradient(145deg,#4338ca 0%,#7c3aed 58%,#a78bfa 140%)",
  emerald: "linear-gradient(145deg,#047857 0%,#059669 52%,#34d399 140%)",
  sky: "linear-gradient(145deg,#0369a1 0%,#0284c7 52%,#38bdf8 140%)",
  rose: "linear-gradient(145deg,#be123c 0%,#e11d48 55%,#fb7185 140%)",
  teal: "linear-gradient(145deg,#0f766e,#2dd4bf)",
  red: "linear-gradient(145deg,#7f1d1d,#dc2626)",
  pink: "linear-gradient(145deg,#9d174d,#db2777)",
  orange: "linear-gradient(145deg,#c2410c,#fb923c)",
  amber: "linear-gradient(145deg,#a16207,#facc15)",
};
const AVATAR = ["#7c3aed", "#0284c7", "#059669", "#e11d48", "#d97706", "#0f766e"];
const SLOT_ICON = { violet: "users", emerald: "banknote", sky: "clock", rose: "circle-alert", calm: "circle-check" };
const DAY_ICON = { teal: "user-check", red: "user-x", orange: "tree-palm", amber: "plane" };
const SECTION_ICON = { overview: "layout-dashboard", people: "users", time: "calendar-clock", payroll: "wallet", documents: "file-text", legal: "scale", others: "ellipsis", settings: "settings" };
const ACTION_ICON = {
  "Nouvel employé": "user-plus", "Pointage": "calendar-clock", "Saisir": "calendar-clock", "Nouveau candidat": "user-plus",
  "Nouveau poste": "briefcase", "Importer": "upload", "Nouvelle mission": "plane", "Nouvelle sortie": "log-out",
  "Imports": "upload", "Déposer un fichier": "upload", "Modèle": "file-down", "Nouveau congé": "calendar-plus",
  "Présence": "calendar-clock", "Calcul de la paie": "calculator", "Générer": "play", "Historique": "history",
  "Nouvelle exception": "shield-alert", "Paie": "wallet", "Nouvelle avance": "hand-coins", "Préparer le fichier": "landmark",
  "Export mensuel": "file-spreadsheet", "Registre": "folder-open", "Nouvelle opération": "plus", "Répartition CSV": "pie-chart",
  "Écritures": "file-spreadsheet", "Nouveau contrat": "file-plus", "Enregistrer": "save", "Nouvelle proposition": "scale",
  "Veille": "radar", "Ajouter un texte": "file-plus", "Lancer l'extraction": "sparkles", "Documents": "folder-open",
  "Actualiser": "refresh-cw", "Sources": "rss", "Réorganiser": "grip", "Vue d'ensemble": "layout-dashboard",
  "Rubriques": "list", "Listes": "list", "Colonnes": "columns-3", "Employés": "users", "Ouvrir les fiches": "id-card",
  "Filtres": "sliders-horizontal", "Congé": "calendar-plus", "Avance": "hand-coins",
};
function ico(name) { return `<i data-lucide="${name}"></i>`; }
function paint() { if (window.lucide) lucide.createIcons(); }

let sectionId = "overview";
let pageId = "dashboard";

function go(id) {
  pageId = id;
  const owner = SECTIONS.find((s) => s.pages.includes(id));
  if (owner) sectionId = owner.id;
  draw();
}

function draw() {
  const section = SECTIONS.find((s) => s.id === sectionId);
  document.getElementById("sections").innerHTML = SECTIONS.map((s) =>
    `<button class="sec${s.id === sectionId ? " on" : ""}" data-go="${s.pages[0]}">${ico(SECTION_ICON[s.id])}${s.label}</button>`
  ).join("");
  document.getElementById("subs").innerHTML = section.pages.map((id) =>
    `<button class="sub${id === pageId ? " on" : ""}" data-go="${id}">${PAGES[id].title}</button>`
  ).join("");
  document.getElementById("app").innerHTML = screen(PAGES[pageId]);
  document.querySelectorAll("[data-go]").forEach((el) => el.addEventListener("click", () => go(el.dataset.go)));
  paint();
}

function actions(page) {
  const [pl, pk, pid] = page.primary;
  const [sl, sk, sid] = page.secondary;
  return `<div class="actions">
    <button class="btn ${sk}" data-go="${sid}">${ico(ACTION_ICON[sl] || "arrow-right")}${sl}</button>
    <button class="btn ${pk}" data-go="${pid}">${ico(ACTION_ICON[pl] || "arrow-right")}${pl}</button>
  </div>`;
}

function head(page) {
  return `<div class="head"><div><p class="date"><i></i>mardi 24 novembre 2026</p><h1>${page.title}</h1></div>${actions(page)}</div>`;
}

function kpiCards(items) {
  return `<div class="kpis">${items.map((k) => `<article class="kpi${k.calm ? " calm" : ""}" style="${k.calm ? "" : `--fill:${FILL[k.accent]}`}">
    <div class="ic">${ico(SLOT_ICON[k.calm ? "calm" : k.accent])}</div><p class="label">${k.label}</p><strong>${k.value}</strong><p class="hint">${k.hint}</p>
  </article>`).join("")}</div>`;
}

function dayStrip() {
  return `<div class="status">${[
    ["0", "Présents", "teal"],
    ["0", "Absents", "red"],
    ["0", "En congé", "orange"],
    ["0", "En mission", "amber"],
  ].map(([v, l, a]) => `<div class="stat" style="--fill:${FILL[a]}"><span class="ic">${ico(DAY_ICON[a])}</span><div><b>${v}</b><span>${l}</span></div></div>`).join("")}</div>`;
}

function table(page) {
  const body = page.rows.map((row, index) => `<tr class="${page.bad && index === 0 ? "bad" : ""}">${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("");
  return `<div class="work">
    <section class="panel">
      <div class="filters"><input placeholder="Rechercher" /><button class="btn ghost">${ico("sliders-horizontal")}Filtres</button></div>
      <table><thead><tr>${page.columns.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>
    </section>
    <aside class="panel"><h2>${page.sideTitle}</h2>${page.side.map((line) => `<div class="side-item"><p>${line}</p></div>`).join("")}</aside>
  </div>`;
}

function screen(page) {
  if (page.kind === "dashboard") return dashboard(page);
  if (page.kind === "people") return people(page);
  if (page.kind === "presence") return presence(page);
  if (page.kind === "form") return form(page);
  if (page.kind === "cards") return cards(page);
  return `${head(page)}${kpiCards(page.kpis)}${table(page)}`;
}

function dashboard(page) {
  const months = ["Déc", "Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Aoû", "Sep", "Oct", "Nov"];
  const ys = [128, 120, 124, 112, 116, 104, 108, 96, 100, 88, 92, 78];
  const dots = months.map((_, i) => `<circle cx="${28 + i * 48}" cy="${ys[i]}" r="3.5" fill="#7c3aed"></circle>`).join("");
  const line = months.map((_, i) => `${i ? "L" : "M"}${28 + i * 48},${ys[i]}`).join(" ");
  const area = `${line} L${28 + 11 * 48},176 L28,176 Z`;
  return `${head(page)}
    ${kpiCards(quad(
      ["107", "Effectif actif", "107 inscrits · 0 contrat ouvert"],
      ["0 DA", "Masse salariale", "Moyenne 0 DA · salaires de base"],
      ["—", "Présence", "Aucun pointage ce mois-ci"],
      ["107", "Sans contrat", "1 sujet à traiter", true],
    ))}
    ${dayStrip()}
    <div class="split">
      <section class="panel">
        <div class="row"><h2>${ico("chart-line")}Évolution des effectifs</h2><div class="seg"><button>6 mois</button><button class="on">12 mois</button></div></div>
        <svg class="chart" viewBox="0 0 600 210">
          <defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></linearGradient></defs>
          <path d="${area}" fill="url(#area)"/>
          <path d="${line}" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
          ${dots}
          ${months.map((m, i) => `<text x="${28 + i * 48}" y="196" text-anchor="middle" fill="#94a3b8" font-size="11">${m}</text>`).join("")}
        </svg>
      </section>
      <section class="panel">
        <h2>${ico("pie-chart")}Répartition des contrats</h2>
        <div class="donut-wrap">
          <svg width="160" height="160" viewBox="0 0 160 160">
            <circle cx="80" cy="80" r="58" fill="none" stroke="#ede9fe" stroke-width="14"/>
            <circle cx="80" cy="80" r="58" fill="none" stroke="#7c3aed" stroke-width="14" stroke-linecap="round" stroke-dasharray="70 294" transform="rotate(-90 80 80)"/>
          </svg>
          <em><strong>0</strong><small>contrat</small></em>
        </div>
      </section>
    </div>
    <div class="bottom">
      <section class="panel"><h2>${ico("bell")}Alertes</h2>
        <div class="alert"><div class="dot">${ico("circle-alert")}</div><div class="grow"><p>Employés sans contrat</p><small>107 employés actifs</small></div><small>à traiter</small></div>
      </section>
      <section class="panel"><h2>${ico("user-round-plus")}Derniers recrutements</h2>
        ${PEOPLE.map((p, i) => `<div class="hire"><div class="av" style="background:${AVATAR[i]}22;color:${AVATAR[i]}">${p[1].slice(0, 1)}</div><div class="grow"><p>${p[1]}</p><small>${p[2]}</small></div><small>${p[3]}</small></div>`).join("")}
      </section>
      <section class="panel"><h2>${ico("zap")}Actions rapides</h2>
        <div class="qa">
          ${[["Pointage", "sky", "presence"], ["Nouvel employé", "violet", "employes"], ["Congé", "orange", "conges"], ["Avance", "emerald", "avances"], ["Documents", "neutral", "registre"]].map(([l, a, id]) =>
            `<button data-go="${id}" class="${a === "neutral" ? "neutral" : ""}" style="${a === "neutral" ? "" : `--wash:${WASH[a]};--accent:${ACCENT[a]}`}">${ico(ACTION_ICON[l])}${l}</button>`).join("")}
        </div>
      </section>
    </div>`;
}

function people(page) {
  return `${head(page)}
    ${kpiCards(quad(["107", "Actifs", "Capture du 24 novembre"], ["0 DA", "Masse", "Salaires de base"], ["—", "Entrées du mois", "Recrutements de la période"], ["107", "Sans contrat", "À régulariser", true]))}
    <div class="work"><section class="panel">
      <div class="filters"><input placeholder="Nom, matricule, poste" /><button class="btn ghost">${ico("columns-3")}Colonnes</button></div>
      <table><thead><tr><th>Matricule</th><th>Nom</th><th>Poste</th><th>Contrat</th></tr></thead>
      <tbody>${PEOPLE.map((p) => `<tr class="bad"><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td><span class="tag" style="--wash:#ffe4e6;--accent:#be123c">Sans contrat</span></td></tr>`).join("")}</tbody></table>
      <p class="note">Quatre noms lus sur votre capture. Le compteur réel est 107.</p>
    </section>
    <aside class="panel"><h2>Fiche</h2><div class="side-item"><p>La ligne ouvre la fiche. La page reste une liste, pas une seconde mosaïque.</p></div></aside></div>`;
}

function presence(page) {
  return `${head(page)}
    ${kpiCards(quad(["107", "À pointer", "Effectif actif"], ["—", "Coût du jour", "Heures non valorisées"], ["—", "Taux du jour", "Aucun pointage ce mois-ci"], ["107", "Sans pointage", "Mois encore vide", true]))}
    ${dayStrip()}
    <div class="work"><section class="panel">
      <div class="pills" style="margin-bottom:12px"><button class="sec on">Par chantier</button><button class="sec">Par employé</button></div>
      <table><thead><tr><th>Employé</th><th>Chantier</th><th>Code</th><th>Heures</th></tr></thead>
      <tbody>${PEOPLE.map((p) => `<tr><td>${p[1]}</td><td>—</td><td><span class="tag" style="--wash:#f1f5f9;--accent:#64748b">Non pointé</span></td><td>—</td></tr>`).join("")}</tbody></table>
    </section>
    <aside class="panel"><h2>Mois</h2><div class="side-item"><p>Novembre 2026 n'a pas de pointage sur la capture. La grille montre les gens, pas des zéros déguisés en cartes.</p></div></aside></div>`;
}

function form(page) {
  return `${head(page)}${kpiCards(page.kpis)}
    <div class="pills" style="margin-bottom:14px">${page.tabs.map((tab, i) => `<button class="sec${i ? "" : " on"}">${tab}</button>`).join("")}</div>
    <div class="work"><section class="panel"><form class="form">${page.fields.map((field) => `<label>${field}<input class="field" placeholder="Selon le barème enregistré" disabled /></label>`).join("")}</form>
    <p class="note">Les taux ne sont pas inventés dans cette maquette.</p></section>
    <aside class="panel"><h2>${page.sideTitle}</h2>${page.side.map((line) => `<div class="side-item"><p>${line}</p></div>`).join("")}</aside></div>`;
}

function cards(page) {
  return `${head(page)}${kpiCards(page.kpis)}<div class="cards">${page.cards.map(([title, text]) => `<article class="set"><b>${title}</b><span>${text}</span></article>`).join("")}</div>`;
}

draw();
</script>
</body>
</html>

# CI gate — P6 (lint ∧ unit ∧ build ∧ playwright @critical)
# Auth-dependent E2E skip without secrets; guest RLS smoke always runs.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint-test-build-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_READ_ONLY_EMAIL: ${{ secrets.E2E_READ_ONLY_EMAIL }}
      E2E_READ_ONLY_PASSWORD: ${{ secrets.E2E_READ_ONLY_PASSWORD }}
      E2E_ADMIN_RH_EMAIL: ${{ secrets.E2E_ADMIN_RH_EMAIL }}
      E2E_ADMIN_RH_PASSWORD: ${{ secrets.E2E_ADMIN_RH_PASSWORD }}
      E2E_ADMIN_FINANCE_EMAIL: ${{ secrets.E2E_ADMIN_FINANCE_EMAIL }}
      E2E_ADMIN_FINANCE_PASSWORD: ${{ secrets.E2E_ADMIN_FINANCE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Placeholder Supabase env (build-only fallback)
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co" >> "$GITHUB_ENV"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder" >> "$GITHUB_ENV"
          fi

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E @critical
        run: npm run test:e2e:critical

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
